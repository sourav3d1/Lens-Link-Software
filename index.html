<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LensLink — Wireless Smartphone Webcam</title>
    <meta name="description" content="Turn your Android or iPhone into a real-time wireless webcam for Windows with automatic Wi-Fi discovery and system-level virtual webcam support." />
    <meta property="og:title" content="LensLink — Wireless Smartphone Webcam" />
    <meta property="og:description" content="Turn your Android or iPhone into a real-time wireless webcam for Windows with automatic Wi-Fi discovery and system-level virtual webcam support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LensLink" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-[#1D4ED8] selection:text-white">
    <script>
      (function () {
        window.__lenslinkDeferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__lenslinkDeferredPrompt = e;
          window.dispatchEvent(new Event('lenslink:install-ready'));
        });
        window.addEventListener('appinstalled', function () {
          window.__lenslinkDeferredPrompt = null;
          window.__lenslinkAppInstalled = true;
          window.dispatchEvent(new Event('lenslink:app-installed'));
        });

        var search = window.location.search || '';
        var path = (window.location.pathname || '').toLowerCase();
        var isMobileUa = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        var isVcam = path === '/vcam' || /[?&]mode=vcam\b/i.test(search);
        var isPc = /[?&]mode=(pc|desktop)\b/i.test(search);
        var isMobile = !isVcam && !isPc && (path === '/phone' || /[?&](mode=phone|mode=mobile|pair=|code=)/i.test(search) || isMobileUa);
        if (isMobile) {
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink && manifestLink.getAttribute('href') !== '/phone-manifest.webmanifest') {
            manifestLink.setAttribute('href', '/phone-manifest.webmanifest');
          }
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', 'LensLink Cam');
          document.title = 'LensLink Cam — Mobile Wireless Webcam';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
